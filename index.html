<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>圖片熱區範例</title>
  <style>
    body {
      text-align: center;
      background-color: #f5f5f5;
      padding-top: 80px;
      font-family: Arial, sans-serif;
    }
    
  </style>
</head>
<body>
  <h2>點擊圖片不同區域執行不同動作</h2>

  <!-- 圖片 + 熱區對應 -->
  <img src="next.jpg" alt="主圖" usemap="#menu-map">

  <!-- 定義熱區 -->
  <map name="menu-map">
    <!-- 左上角區域（矩形範圍） -->
    <area shape="rect" coords="522,256,3,137" alt="區域1" href="#" onclick="area1Action()">

    <!-- 右上角區域 -->
    <area shape="rect" coords="1042,256,523,137" alt="區域2" href="#" onclick="area2Action()">

    <!-- 下方圓形按鈕區 -->
    <area shape="circle" coords="817,966,108" alt="圓形按鈕" href="#" onclick="area3Action()">
  </map>

  <script>
    function area1Action() {
      alert("你點了左上角區域！");
      // 或者：window.location.href = "page1.html";
    }

    function area2Action() {
      alert("你點了右上角區域！");
      // 或者：window.location.href = "page2.html";
    }

    function area3Action() {
      alert("你點了下方圓形按鈕！");
      // 或者：window.location.href = "page3.html";
    }
  </script>
</body>
</html>
